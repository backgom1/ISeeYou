spring:
  config:
    import: "application-secret.yml"

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: true
        format_sql: true

  datasource:
    url: jdbc:h2:tcp://localhost/~/test
    username: "sa"
    password: "1"
    driver-class-name: org.h2.Driver

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org:
        quartz:
          scheduler:
            instanceName: QuartzScheduler
          jobStore:
            tablePrefix: QRTZ_
            isClustered: false
          threadPool:
            threadCount: 5
